name: CI

on:
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened, ready_for_review, edited]
  push:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    name: PR policy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Validate pull request route
        if: github.event_name == 'pull_request'
        run: python3 scripts/check_pr.py

  backend:
    name: Backend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.9"
          python-version: "3.13"
      - name: Install locked dependencies
        run: uv sync --locked --dev
      - name: Lint
        run: uv run --frozen ruff check .
      - name: Check formatting
        run: uv run --frozen ruff format --check .
      - name: Unit tests
        run: uv run --frozen python -m unittest discover -s tests -v

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Detect frontend
        id: detect
        shell: bash
        run: |
          if [ -d frontend ]; then
            test -f frontend/package.json || { echo 'frontend/package.json is required'; exit 1; }
            echo 'present=true' >> "$GITHUB_OUTPUT"
          else
            echo 'Frontend has not been added yet; see CONTRIBUTING.md.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        if: steps.detect.outputs.present == 'true'
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        if: steps.detect.outputs.present == 'true'
        working-directory: frontend
        run: npm ci
      - name: Lint
        if: steps.detect.outputs.present == 'true'
        working-directory: frontend
        run: npm run lint
      - name: TypeScript check
        if: steps.detect.outputs.present == 'true'
        working-directory: frontend
        shell: bash
        run: |
          if node -e "const p=require('./package.json'); process.exit(p.dependencies?.typescript || p.devDependencies?.typescript ? 0 : 1)" \
            || [ -n "$(find . -path ./node_modules -prune -o -type f \( -name '*.ts' -o -name '*.tsx' -o -name '*.mts' -o -name '*.cts' -o -name 'tsconfig*.json' \) -print -quit)" ]; then
            npm run typecheck
          fi
      - name: Production build
        if: steps.detect.outputs.present == 'true'
        working-directory: frontend
        run: npm run build
