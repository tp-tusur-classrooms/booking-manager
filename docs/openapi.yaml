    post:
      tags: [Schedule]
      operationId: createLesson
      summary: Добавить занятие
      description: |
        Только для администратора. Занятие не должно пересекаться с другими
        занятиями в той же аудитории.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LessonWrite'
            example:
              room_id: 4e5f6a7b-0000-4000-8000-000000000405
              period_id: 3d4e5f6a-0000-4000-8000-000000000001
              weekday: 4
              week_parity: every
              starts_on: '2026-09-01'
              ends_on: '2026-12-30'
              subject: Технология программирования
              group: 432-1
              teacher: Петров П. П.
      responses:
        '201':
          description: Занятие добавлено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lesson'
              examples:
                created:
                  $ref: '#/components/examples/Lesson'
        '400':
          $ref: '#/components/responses/LessonValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
