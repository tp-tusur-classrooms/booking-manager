  /lessons/{lesson_id}:
    parameters:
      - $ref: '#/components/parameters/LessonId'
    get:
      tags: [Schedule]
      operationId: getLesson
      summary: Получить занятие
      responses:
        '200':
          description: Занятие
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lesson'
              examples:
                lesson:
                  $ref: '#/components/examples/Lesson'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Schedule]
      operationId: updateLesson
      summary: Изменить занятие
      description: |
        Только для администратора. Заменяет все поля занятия. Само изменяемое
        занятие не учитывается при проверке пересечений.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LessonWrite'
            example:
              room_id: 4e5f6a7b-0000-4000-8000-000000000405
              period_id: 3d4e5f6a-0000-4000-8000-000000000002
              weekday: 4
              week_parity: odd
              starts_on: '2026-09-01'
              ends_on: '2026-12-30'
              subject: Технология программирования
              group: 432-1
              teacher: Петров П. П.
      responses:
        '200':
          description: Занятие изменено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lesson'
              example:
                id: 5f6a7b8c-0000-4000-8000-000000000001
                room:
                  id: 4e5f6a7b-0000-4000-8000-000000000405
                  number: '405'
                  building:
                    id: 1b2c3d4e-0000-4000-8000-000000000001
                    name: Корпус 1
                period:
                  id: 3d4e5f6a-0000-4000-8000-000000000002
                  order: 2
                  start_time: '10:40'
                  end_time: '12:15'
                weekday: 4
                week_parity: odd
                starts_on: '2026-09-01'
                ends_on: '2026-12-30'
                subject: Технология программирования
                group: 432-1
                teacher: Петров П. П.
        '400':
          $ref: '#/components/responses/LessonValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/LessonConflict'
    delete:
      tags: [Schedule]
      operationId: deleteLesson
      summary: Удалить занятие
      description: Только для администратора.
      responses:
        '204':
          description: Занятие удалено
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    RoomId:
      name: room_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    LessonId:
      name: lesson_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  examples:
    Lesson:
      summary: Занятие по четвергам
      value:
        id: 5f6a7b8c-0000-4000-8000-000000000001
        room:
          id: 4e5f6a7b-0000-4000-8000-000000000405
          number: '405'
          building:
            id: 1b2c3d4e-0000-4000-8000-000000000001
            name: Корпус 1
        period:
          id: 3d4e5f6a-0000-4000-8000-000000000001
          order: 1
          start_time: '08:50'
          end_time: '10:25'
        weekday: 4
        week_parity: every
        starts_on: '2026-09-01'
        ends_on: '2026-12-30'
        subject: Технология программирования
        group: 432-1
        teacher: Петров П. П.
    Room405:
      summary: Аудитория с оборудованием
      value:
        id: 4e5f6a7b-0000-4000-8000-000000000405
        number: '405'
        building:
          id: 1b2c3d4e-0000-4000-8000-000000000001
          name: Корпус 1
        floor: 4
        capacity: 30
        equipment:
          - id: 2c3d4e5f-0000-4000-8000-000000000001
            name: Интерактивная доска
          - id: 2c3d4e5f-0000-4000-8000-000000000004
            name: Проектор
        description: Светлая аудитория для консультаций, семинаров и встреч небольших учебных групп.
        photo_url: http://127.0.0.1:4001/public/rooms/5a6b7c8d9e0f4a1b.jpg
        status: published
  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          const: ok
    Role:
      type: string
      enum: [user, admin]
      description: Роль пользователя. Назначается только сервером.
    Name:
      type: string
      minLength: 1
      maxLength: 50
      pattern: '^[A-Za-zА-ЯЁа-яё\- ]+$'
      description: Имя для отображения. Буквы, пробел и дефис.
    Login:
      type: string
      minLength: 3
      maxLength: 32
      pattern: '^[A-Za-z0-9._-]+$'
      description: Уникальный логин. Сравнивается без учёта регистра.
    User:
      type: object
      required: [id, name, login, role]
      properties:
        id:
          type: string
          format: uuid
        name:
          $ref: '#/components/schemas/Name'
        login:
          $ref: '#/components/schemas/Login'
        role:
          $ref: '#/components/schemas/Role'
    LoginRequest:
      type: object
      required: [login, password]
      properties:
        login:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 1
    SignedUser:
      type: object
      required: [user, token, refresh_token]
      properties:
        user:
          $ref: '#/components/schemas/User'
        token:
          type: string
          description: Access-токен, действует 30 минут.
        refresh_token:
          type: string
          description: Refresh-токен, действует 30 дней.
    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
          minLength: 1
    RefreshedToken:
      type: object
      required: [token]
      properties:
        token:
          type: string
          description: Новый access-токен.
    Building:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          description: Название для показа, например «Корпус 1».
    BuildingList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Building'
    Equipment:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
    EquipmentList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Equipment'
    RoomStatus:
      type: string
      enum: [draft, published]
      description: |
        `draft` — черновик, виден только администратору.
        `published` — опубликована, видна в каталоге.
    RoomNumber:
      type: string
      minLength: 1
      maxLength: 20
      description: Номер аудитории, уникален в пределах корпуса без учёта регистра.
    Room:
      type: object
      required: [id, number, building, floor, capacity, equipment, description, photo_url, status]
      properties:
        id:
          type: string
          format: uuid
        number:
          $ref: '#/components/schemas/RoomNumber'
        building:
          $ref: '#/components/schemas/Building'
        floor:
          type: integer
        capacity:
          type: integer
          minimum: 1
          description: Количество мест.
        equipment:
          type: array
          description: Пустой список означает, что оборудование не указано.
          items:
            $ref: '#/components/schemas/Equipment'
        description:
          type: [string, 'null']
          maxLength: 1000
        photo_url:
          type: [string, 'null']
          format: uri
          description: Абсолютная ссылка на фотографию или `null`, если её нет.
        status:
          $ref: '#/components/schemas/RoomStatus'
    RoomList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Room'
    RoomCreate:
      type: object
      required: [number, building_id, floor, capacity]
      additionalProperties: false
      properties:
        number:
          $ref: '#/components/schemas/RoomNumber'
        building_id:
          type: string
          format: uuid
          description: Корпус из `GET /buildings`.
        floor:
          type: integer
          minimum: -5
          maximum: 50
        capacity:
          type: integer
          minimum: 1
          maximum: 1000
        equipment_ids:
          type: array
          uniqueItems: true
          default: []
          description: Оборудование из `GET /equipment`.
          items:
            type: string
            format: uuid
        description:
          type: [string, 'null']
          maxLength: 1000
    RoomPhotoUpload:
      type: object
      required: [file]
      properties:
        file:
          type: string
          contentMediaType: application/octet-stream
          description: Изображение JPG или PNG до 10 МБ.
    Time:
      type: string
      pattern: '^([01]\d|2[0-3]):[0-5]\d$'
      description: Время `HH:MM` по часовому поясу `Asia/Tomsk`.
    TeachingPeriod:
      type: object
      required: [id, order, start_time, end_time]
      properties:
        id:
          type: string
          format: uuid
        order:
          type: integer
          minimum: 1
          description: Порядковый номер периода в дне.
        start_time:
          $ref: '#/components/schemas/Time'
        end_time:
          $ref: '#/components/schemas/Time'
    TeachingPeriodList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TeachingPeriod'
    Weekday:
      type: integer
      minimum: 1
      maximum: 7
      description: День недели по ISO 8601, 1 — понедельник, 7 — воскресенье.
    WeekParity:
      type: string
      enum: [every, odd, even]
      description: |
        `every` — каждую неделю, `odd` — по нечётным, `even` — по чётным неделям
        учебного года.
    LessonText:
      type: [string, 'null']
      minLength: 1
      maxLength: 200
    RoomSummary:
      type: object
      required: [id, number, building]
      properties:
        id:
          type: string
          format: uuid
        number:
          $ref: '#/components/schemas/RoomNumber'
        building:
          $ref: '#/components/schemas/Building'
    Lesson:
      type: object
      required: [id, room, period, weekday, week_parity, starts_on, ends_on, subject, group, teacher]
      properties:
        id:
          type: string
          format: uuid
        room:
          $ref: '#/components/schemas/RoomSummary'
        period:
          $ref: '#/components/schemas/TeachingPeriod'
        weekday:
          $ref: '#/components/schemas/Weekday'
        week_parity:
          $ref: '#/components/schemas/WeekParity'
        starts_on:
          type: string
          format: date
        ends_on:
          type: string
          format: date
        subject:
          $ref: '#/components/schemas/LessonText'
        group:
          $ref: '#/components/schemas/LessonText'
        teacher:
          $ref: '#/components/schemas/LessonText'
    LessonList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Lesson'
    LessonWrite:
      type: object
      required: [room_id, period_id, weekday, week_parity, starts_on, ends_on]
      additionalProperties: false
      properties:
        room_id:
          type: string
          format: uuid
          description: Аудитория, в том числе черновик.
        period_id:
          type: string
          format: uuid
          description: Учебный период из `GET /periods`.
        weekday:
          $ref: '#/components/schemas/Weekday'
        week_parity:
          $ref: '#/components/schemas/WeekParity'
        starts_on:
          type: string
          format: date
          description: Первая дата действия занятия.
        ends_on:
          type: string
          format: date
          description: Последняя дата действия занятия, не раньше `starts_on`.
        subject:
          $ref: '#/components/schemas/LessonText'
        group:
          $ref: '#/components/schemas/LessonText'
        teacher:
          $ref: '#/components/schemas/LessonText'
    LessonBrief:
      type: object
      required: [id, subject, group, teacher]
      properties:
        id:
          type: string
          format: uuid
        subject:
          $ref: '#/components/schemas/LessonText'
        group:
          $ref: '#/components/schemas/LessonText'
        teacher:
          $ref: '#/components/schemas/LessonText'
    AvailabilityStatus:
      type: string
      enum: [free, lesson, past]
      description: |
        `free` — свободно, `lesson` — учебное занятие, `past` — период уже начался
        или прошёл. Список может расширяться.
    PeriodAvailability:
      type: object
      required: [period, status, lesson]
      properties:
        period:
          $ref: '#/components/schemas/TeachingPeriod'
        status:
          $ref: '#/components/schemas/AvailabilityStatus'
        lesson:
          description: Занятие при статусе `lesson`, иначе `null`.
          oneOf:
            - $ref: '#/components/schemas/LessonBrief'
            - type: 'null'
    RoomAvailability:
      type: object
      required: [room_id, date, periods]
      properties:
        room_id:
          type: string
          format: uuid
        date:
          type: string
          format: date
        periods:
          type: array
          items:
            $ref: '#/components/schemas/PeriodAvailability'
    LessonConflictError:
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          required: [conflicts]
          properties:
            conflicts:
              type: array
              description: Занятия, с которыми пересекается новое или изменённое.
              items:
                $ref: '#/components/schemas/Lesson'
    FieldError:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
          description: Имя поля запроса.
        message:
          type: string
          description: Сообщение для показа рядом с полем.
    Error:
      type: object
      required: [message, status_code, code]
      properties:
        message:
          type: string
          description: Сообщение для пользователя.
        status_code:
          type: integer
          description: Дублирует HTTP-статус.
        code:
          type: string
          description: |
            Машиночитаемый код ошибки: `validation_error`, `not_authenticated`,
            `invalid_token`, `token_expired`, `invalid_credentials`,
            `invalid_refresh_token`, `forbidden`, `not_found`,
            `room_number_taken`, `file_too_large`, `unsupported_media_type`,
            `lesson_conflict`.
        errors:
          type: array
          description: Ошибки отдельных полей. Есть только у `validation_error` и ошибок дублей.
