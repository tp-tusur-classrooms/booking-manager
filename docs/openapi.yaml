openapi: 3.1.0
info:
  title: Бронирование аудиторий ТУСУР
  version: 0.1.0
  description: |
    Статический контракт API первого спринта. Описывает поведение, на которое
    опираются фронтенд и бэкенд при параллельной разработке.

    ## Авторизация

    Защищённые методы принимают access-токен в заголовке
    `Authorization: Bearer <token>`. Access-токен действует 30 минут,
    refresh-токен действует 30 дней. Оба выдаются при входе.

    Роль пользователя (`user` или `admin`) возвращается методом `GET /profile`
    и в ответе входа. Учётные записи создаются и роли назначаются вне API.
    Публичной регистрации и операций с почтой нет.

    Отсутствие или недействительность токена — `401`. Недостаточно прав — `403`.

    ## Истечение сессии

    Когда access-токен истёк, защищённый метод отвечает `401` с кодом
    `token_expired`. Клиент один раз вызывает `POST /auth/refresh` и повторяет
    исходный запрос с новым токеном. Если refresh тоже отвечает `401`, клиент
    удаляет токены и переходит на экран входа. Методы `/auth/refresh` и
    `/auth/logout` не требуют access-токен, поэтому цикла перенаправлений нет.

    ## Выход

    `POST /auth/logout` отзывает переданный refresh-токен и всегда отвечает
    `204`. Клиент удаляет оба токена. Access-токен не отзывается сервером
    и перестаёт действовать по истечении срока.

    ## Даты и время

    Все даты и время относятся к часовому поясу `Asia/Tomsk` (UTC+7, без
    перехода на летнее время).

    - Календарная дата — строка `YYYY-MM-DD`, например `2026-10-22`.
    - Время начала и окончания учебного периода — строка `HH:MM`, например `13:15`.
    - Момент времени — RFC 3339 со смещением, например `2026-10-22T13:15:00+07:00`.

    ## Учебные периоды и расписание

    Учебный период — фиксированный интервал дня из справочника `GET /periods`,
    например `13:15–14:50`. Свободный ввод времени не предусмотрен.

    Занятие повторяется в выбранный день недели и учебный период с даты
    `starts_on` по дату `ends_on` включительно: каждую неделю, только по нечётным
    или только по чётным неделям. Неделя начинается в понедельник. Первая неделя
    учебного года — неделя, содержащая 1 сентября; она нечётная. Учебный год
    длится с 1 сентября по 31 августа.

    Два занятия пересекаются, если у них одна аудитория, один день недели
    и один учебный период, диапазоны дат перекрываются, а недели совместимы
    (`every` совместима с любой, `odd` с `odd`, `even` с `even`).

    Список статусов занятости может расширяться в следующих спринтах. Клиент
    считает неизвестный статус недоступным для выбора.

    ## Ошибки

    Все ошибки возвращаются в одном формате `Error`. Поле `code` предназначено
    для программной обработки, `message` — для показа пользователю. Ошибки
    отдельных полей перечисляются в `errors` с кодом `validation_error`
    и статусом `400`.
servers:
  - url: /api/v1
    description: Тот же origin, что и фронтенд
  - url: http://127.0.0.1:4001/api/v1
    description: Локальный FastAPI
tags:
  - name: Auth
    description: Вход, выход и обновление сессии
  - name: Users
    description: Текущий пользователь и роль
  - name: References
    description: Справочники корпусов и оборудования
  - name: Rooms
    description: Каталог, карточка, создание и публикация аудиторий
  - name: Schedule
    description: Учебные периоды, глобальное расписание и занятость аудиторий
  - name: System
    description: Служебные методы
security:
  - bearerAuth: []
paths:
  /health:
    get:
      tags: [System]
      operationId: getHealth
      summary: Проверить доступность API
      security: []
      responses:
        '200':
          description: API работает
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              example:
                status: ok
  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Войти
      description: |
        Проверяет логин и пароль. При неверной паре не сообщает, какое
        из значений ошибочно.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              login: ivanov
              password: Secret-123
      responses:
        '200':
          description: Сессия открыта
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignedUser'
              examples:
                user:
                  summary: Пользователь
                  value:
                    user:
                      id: 3f6c2a1e-5b7d-4c8e-9f10-2a3b4c5d6e7f
                      name: Иван Иванов
                      login: ivanov
                      role: user
                    token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.access
                    refresh_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.refresh
                admin:
                  summary: Администратор
                  value:
                    user:
                      id: 9a8b7c6d-5e4f-4a3b-8c2d-1e0f9a8b7c6d
                      name: Пётр Петров
                      login: admin
                      role: admin
                    token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.access
                    refresh_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.refresh
        '400':
          description: Не заполнены поля
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Проверьте заполнение полей
                status_code: 400
                code: validation_error
                errors:
                  - field: password
                    message: Введите пароль
        '401':
          description: Неверный логин или пароль
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Не удалось войти. Проверьте логин и пароль.
                status_code: 401
                code: invalid_credentials
  /auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshToken
      summary: Обновить access-токен
      description: |
        Выдаёт новый access-токен по действующему refresh-токену.
        Access-токен не требуется.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
            example:
              refresh_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.refresh
      responses:
        '200':
          description: Новый access-токен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshedToken'
              example:
                token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.access
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          description: Refresh-токен истёк, отозван или недействителен. Клиент завершает сессию.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Сессия истекла. Войдите снова.
                status_code: 401
                code: invalid_refresh_token
  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Выйти
      description: |
        Отзывает refresh-токен. Отвечает `204` и для уже отозванного
        или истёкшего токена. Access-токен не требуется.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
            example:
              refresh_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.refresh
      responses:
        '204':
          description: Сессия завершена
        '400':
          $ref: '#/components/responses/ValidationError'
  /profile:
    get:
      tags: [Users]
      operationId: getProfile
      summary: Получить текущего пользователя
      description: Возвращает имя для шапки и роль для выбора навигации.
      responses:
        '200':
          description: Текущий пользователь
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              examples:
                user:
                  summary: Пользователь
                  value:
                    id: 3f6c2a1e-5b7d-4c8e-9f10-2a3b4c5d6e7f
                    name: Иван Иванов
                    login: ivanov
                    role: user
                admin:
                  summary: Администратор
                  value:
                    id: 9a8b7c6d-5e4f-4a3b-8c2d-1e0f9a8b7c6d
                    name: Пётр Петров
                    login: admin
                    role: admin
        '401':
          $ref: '#/components/responses/Unauthorized'
  /buildings:
    get:
      tags: [References]
      operationId: listBuildings
      summary: Получить справочник корпусов
      description: Справочник ведётся вне API. Порядок — по названию.
      responses:
        '200':
          description: Корпуса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BuildingList'
              examples:
                filled:
                  summary: Есть корпуса
                  value:
                    items:
                      - id: 1b2c3d4e-0000-4000-8000-000000000001
                        name: Корпус 1
                      - id: 1b2c3d4e-0000-4000-8000-000000000002
                        name: Корпус 2
                empty:
                  summary: Справочник пуст
                  value:
                    items: []
        '401':
          $ref: '#/components/responses/Unauthorized'
  /equipment:
    get:
      tags: [References]
      operationId: listEquipment
      summary: Получить справочник оборудования
      description: Справочник ведётся вне API. Порядок — по названию.
      responses:
        '200':
          description: Виды оборудования
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EquipmentList'
              examples:
                filled:
                  summary: Есть оборудование
                  value:
                    items:
                      - id: 2c3d4e5f-0000-4000-8000-000000000001
                        name: Интерактивная доска
                      - id: 2c3d4e5f-0000-4000-8000-000000000002
                        name: Компьютеры
                      - id: 2c3d4e5f-0000-4000-8000-000000000003
                        name: Микрофон
                      - id: 2c3d4e5f-0000-4000-8000-000000000004
                        name: Проектор
                empty:
                  summary: Справочник пуст
                  value:
                    items: []
        '401':
          $ref: '#/components/responses/Unauthorized'
  /rooms:
    get:
      tags: [Rooms]
      operationId: listRooms
      summary: Получить каталог аудиторий
      description: |
        Пользователь получает только опубликованные аудитории. Администратор
        получает все, включая черновики. Порядок — по названию корпуса,
        затем по номеру.
      responses:
        '200':
          description: Аудитории
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomList'
              examples:
                filled:
                  summary: Каталог
                  value:
                    items:
                      - id: 4e5f6a7b-0000-4000-8000-000000000405
                        number: '405'
                        building:
                          id: 1b2c3d4e-0000-4000-8000-000000000001
                          name: Корпус 1
                        floor: 4
                        capacity: 30
                        equipment:
                          - id: 2c3d4e5f-0000-4000-8000-000000000001
                            name: Интерактивная доска
                          - id: 2c3d4e5f-0000-4000-8000-000000000004
                            name: Проектор
                        description: Светлая аудитория для консультаций, семинаров и встреч небольших учебных групп.
                        photo_url: http://127.0.0.1:4001/public/rooms/5a6b7c8d9e0f4a1b.jpg
                        status: published
                      - id: 4e5f6a7b-0000-4000-8000-000000000407
                        number: '407'
                        building:
                          id: 1b2c3d4e-0000-4000-8000-000000000001
                          name: Корпус 1
                        floor: 4
                        capacity: 50
                        equipment:
                          - id: 2c3d4e5f-0000-4000-8000-000000000002
                            name: Компьютеры
                          - id: 2c3d4e5f-0000-4000-8000-000000000004
                            name: Проектор
                        description: null
                        photo_url: null
                        status: published
                empty:
                  summary: Каталог пуст
                  value:
                    items: []
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Rooms]
      operationId: createRoom
      summary: Добавить аудиторию
      description: |
        Только для администратора. Аудитория создаётся черновиком
        (`status: draft`) и не видна пользователям до публикации.
        Фотография загружается отдельно методом `PUT /rooms/{room_id}/photo`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoomCreate'
            example:
              number: '512'
              building_id: 1b2c3d4e-0000-4000-8000-000000000001
              floor: 5
              capacity: 40
              equipment_ids:
                - 2c3d4e5f-0000-4000-8000-000000000004
              description: Аудитория для занятий, консультаций и командной работы.
      responses:
        '201':
          description: Черновик аудитории создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Room'
              example:
                id: 4e5f6a7b-0000-4000-8000-000000000512
                number: '512'
                building:
                  id: 1b2c3d4e-0000-4000-8000-000000000001
                  name: Корпус 1
                floor: 5
                capacity: 40
                equipment:
                  - id: 2c3d4e5f-0000-4000-8000-000000000004
                    name: Проектор
                description: Аудитория для занятий, консультаций и командной работы.
                photo_url: null
                status: draft
        '400':
          description: Ошибки полей
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidFields:
                  summary: Пустой номер и нулевая вместимость
                  value:
                    message: Проверьте заполнение полей
                    status_code: 400
                    code: validation_error
                    errors:
                      - field: number
                        message: Введите номер аудитории
                      - field: capacity
                        message: Введите число больше 0
                unknownReference:
                  summary: Корпус или оборудование не из справочника
                  value:
                    message: Проверьте заполнение полей
                    status_code: 400
                    code: validation_error
                    errors:
                      - field: building_id
                        message: Выберите корпус из списка
                      - field: equipment_ids
                        message: Выберите оборудование из списка
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/RoomNumberTaken'
  /rooms/{room_id}:
    parameters:
      - $ref: '#/components/parameters/RoomId'
    get:
      tags: [Rooms]
      operationId: getRoom
      summary: Получить карточку аудитории
      description: |
        Пользователь получает только опубликованную аудиторию, для черновика
        возвращается `404`. Администратор получает любую.
      responses:
        '200':
          description: Аудитория
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Room'
              examples:
                withEquipment:
                  $ref: '#/components/examples/Room405'
                withoutEquipment:
                  summary: Оборудование не указано
                  value:
                    id: 4e5f6a7b-0000-4000-8000-000000000210
                    number: '210'
                    building:
                      id: 1b2c3d4e-0000-4000-8000-000000000001
                      name: Корпус 1
                    floor: 2
                    capacity: 30
                    equipment: []
                    description: null
                    photo_url: null
                    status: published
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /rooms/{room_id}/publish:
    parameters:
      - $ref: '#/components/parameters/RoomId'
    post:
      tags: [Rooms]
      operationId: publishRoom
      summary: Опубликовать аудиторию
      description: |
        Только для администратора. Делает аудиторию видимой в каталоге.
        Повторная публикация не считается ошибкой и возвращает ту же аудиторию.
      responses:
        '200':
          description: Аудитория опубликована
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Room'
              example:
                id: 4e5f6a7b-0000-4000-8000-000000000512
                number: '512'
                building:
                  id: 1b2c3d4e-0000-4000-8000-000000000001
                  name: Корпус 1
                floor: 5
                capacity: 40
                equipment:
                  - id: 2c3d4e5f-0000-4000-8000-000000000004
                    name: Проектор
                description: Аудитория для занятий, консультаций и командной работы.
                photo_url: http://127.0.0.1:4001/public/rooms/8f1d2c3b4a5e4f60.jpg
                status: published
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /rooms/{room_id}/photo:
    parameters:
      - $ref: '#/components/parameters/RoomId'
    put:
      tags: [Rooms]
      operationId: uploadRoomPhoto
      summary: Загрузить фотографию аудитории
      description: |
        Только для администратора. У аудитории одна фотография, новая
        заменяет предыдущую. Принимаются JPG и PNG размером до 10 МБ.
        Тип определяется по содержимому файла, а не по расширению.
        Сервер может уменьшить изображение; ссылка возвращается в `photo_url`.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RoomPhotoUpload'
            encoding:
              file:
                contentType: image/jpeg, image/png
      responses:
        '200':
          description: Фотография сохранена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Room'
              example:
                id: 4e5f6a7b-0000-4000-8000-000000000512
                number: '512'
                building:
                  id: 1b2c3d4e-0000-4000-8000-000000000001
                  name: Корпус 1
                floor: 5
                capacity: 40
                equipment:
                  - id: 2c3d4e5f-0000-4000-8000-000000000004
                    name: Проектор
                description: Аудитория для занятий, консультаций и командной работы.
                photo_url: http://127.0.0.1:4001/public/rooms/8f1d2c3b4a5e4f60.jpg
                status: draft
        '400':
          description: Файл не передан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Проверьте заполнение полей
                status_code: 400
                code: validation_error
                errors:
                  - field: file
                    message: Выберите файл
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          description: Файл больше 10 МБ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Файл должен быть не больше 10 МБ
                status_code: 413
                code: file_too_large
                errors:
                  - field: file
                    message: Файл должен быть не больше 10 МБ
        '415':
          description: Файл не JPG и не PNG
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Загрузите изображение JPG или PNG
                status_code: 415
                code: unsupported_media_type
                errors:
                  - field: file
                    message: Загрузите изображение JPG или PNG
  /rooms/{room_id}/availability:
    parameters:
      - $ref: '#/components/parameters/RoomId'
    get:
      tags: [Schedule]
      operationId: getRoomAvailability
      summary: Получить занятость аудитории на дату
      description: |
        Возвращает все учебные периоды выбранной даты по порядку.
        Статус определяется так:
        - `lesson` — период занят учебным занятием, в том числе в прошлом;
        - `past` — занятия нет, но начало периода уже наступило;
        - `free` — период свободен.

        Пользователь получает занятость только опубликованной аудитории,
        для черновика возвращается `404`.
      parameters:
        - name: date
          in: query
          required: true
          description: Дата по часовому поясу `Asia/Tomsk`.
          schema:
            type: string
            format: date
          example: '2026-10-22'
      responses:
        '200':
          description: Занятость по учебным периодам
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomAvailability'
              examples:
                withLesson:
                  summary: Есть учебное занятие
                  value:
                    room_id: 4e5f6a7b-0000-4000-8000-000000000405
                    date: '2026-10-22'
                    periods:
                      - period:
                          id: 3d4e5f6a-0000-4000-8000-000000000001
                          order: 1
                          start_time: '08:50'
