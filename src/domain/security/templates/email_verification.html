<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Подтверждение email</title>
</head>
<body style="font-family: Arial, sans-serif; background: #f4f4f4; padding: 40px;">
  <div style="max-width: 480px; margin: 0 auto; background: #fff; border-radius: 8px; padding: 32px;">
    <h2 style="color: #333;">Подтверждение email</h2>
    <p style="color: #555;">Спасибо за регистрацию! Подтвердите адрес <strong>$email</strong>.</p>
    <p style="color: #555;">Код подтверждения:</p>
    <div style="font-size: 32px; font-weight: bold; letter-spacing: 8px; text-align: center;
                background: #f0f0f0; border-radius: 6px; padding: 16px; margin: 24px 0;">
      $code
    </div>
    <p style="color: #888; font-size: 13px;">
      Код действителен в течение 30 минут.<br>
      Если вы не создавали аккаунт - проигнорируйте это письмо.
    </p>
  </div>
</body>
</html>
